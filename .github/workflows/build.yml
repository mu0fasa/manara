name: Build Android APK from ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    name: Unzip and build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          set -e
          rm -rf _tmp project
          FOUND=""
          # نبحث بين كل ملفات zip عن مشروع الأندرويد (الذي فيه settings.gradle)
          for ZIP in *.zip; do
            [ -f "$ZIP" ] || continue
            if unzip -Z1 "$ZIP" | grep -qE '(^|/)settings\.gradle$'; then
              FOUND="$ZIP"; break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "No Android project zip found (a zip containing settings.gradle)."
            echo "Zip files in repo:"; ls -1 *.zip 2>/dev/null || echo "(none)"
            exit 1
          fi
          echo "Using $FOUND"
          unzip -q "$FOUND" -d _tmp
          # لو الملفات داخل مجلد واحد نستخدمه، وإلا نستخدم الجذر
          if [ "$(ls -A _tmp | wc -l)" -eq 1 ] && [ -d "_tmp/$(ls _tmp)" ]; then
            mv "_tmp/$(ls _tmp)" project
          else
            mv _tmp project
          fi
          test -f project/settings.gradle
          ls project

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Manara-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
